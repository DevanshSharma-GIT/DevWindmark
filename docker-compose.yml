services:
  backend:
    build:
      context: ./backend
    environment:
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
      DECISION_CUTOFF_TIME: "09:20"
      DECISION_TIMEZONE: Europe/London
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data/cache:/app/data/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend
